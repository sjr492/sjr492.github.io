<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Four | Sebastian Rivas</title><link rel="icon" href="../SR.ico"><link rel="stylesheet" href="demo.css"></head><body><main><nav><a href="../index.html#projects">← Back to projects</a><a href="https://github.com/sjr492/Connect-Four-Game" target="_blank" rel="noopener noreferrer">View Code ↗</a></nav><h1>Connect Four</h1><p>Connect four pieces horizontally, vertically, or diagonally. Choose a column to drop a piece. Player 1 is O; Player 2 is X.</p><section aria-label="Connect Four game"><div class="controls"><label for="level">Opponent<select id="level"><option value="0">Two players</option><option value="1">Level 1 · Random moves</option><option value="2">Level 2 · Finds winning moves</option><option value="3" selected>Level 3 · Wins and blocks</option></select></label><button id="restart" type="button">New game</button></div><p id="status" role="status" aria-live="polite"></p><div id="board" role="group" aria-label="Game board. Choose a column to play."></div></section><small>Browser adaptation of the Java CLI project, using the same four opponent modes. Changing the opponent starts a new game.</small><noscript><p>Please enable JavaScript to play.</p></noscript></main><script type="module" src="connect-four.mjs"></script></body></html>
